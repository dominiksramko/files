# Live reload config for `air` (used by the dev container, see docker-compose.dev.yml).
# Build output goes to /tmp so nothing lands in the bind-mounted source tree.
root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/server ./cmd/server"
  entrypoint = ["/tmp/air/server"]
  include_ext = ["go"]
  exclude_dir = ["data"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  send_interrupt = true
  kill_delay = "2s"

[misc]
  clean_on_exit = true
