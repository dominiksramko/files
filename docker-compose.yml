services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      DB_PATH: /data/files.db
      USERS_ROOT: /data/users
      GIN_MODE: release
    volumes:
      - db_data:/data
      # Mount user folders here. Example:
      # - /host/path/alice:/data/users/alice
      # - /host/path/bob:/data/users/bob
    networks:
      - internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
