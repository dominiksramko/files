services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      DB_PATH: /data/files.db
      USERS_ROOT: /data/users
      THUMB_CACHE_DIR: /data/thumbs
      GIN_MODE: release
    volumes:
      - db_data:/data
      # Mount user folders here. Example:
      # - /host/path/alice:/data/users/alice
      # - /host/path/bob:/data/users/bob
    networks:
      - caddy

volumes:
  db_data:

networks:
  caddy:
    external: true
