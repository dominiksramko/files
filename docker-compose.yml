services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # deploy.sh also tags each build with its commit (files:<commit>), keeps
    # the previous one to roll back to, and removes older ones.
    image: files:latest
    restart: unless-stopped
    # On stop, uploads and extractions in progress get up to 100 s to finish
    # (the server's shutdown timeout) before the container is killed.
    stop_grace_period: 110s
    environment:
      PORT: "8080"
      # Required: signs the short-lived links Office previews use; keep it stable.
      # Generate one with: openssl rand -hex 32
      JWT_SECRET: "${JWT_SECRET}"
      # Optional: set the initial admin credentials (only used on first run).
      # If ADMIN_PASSWORD is unset, a random password is printed to the logs.
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_PATH: "${ADMIN_PATH:-}"
      # The server runs as this user and group, not root. It must be able to
      # read and write the folders mounted below (usually: the account that owns them).
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      DB_PATH: /data/files.db
      USERS_ROOT: /data/users
      THUMB_CACHE_DIR: /data/thumbs
      HLS_CACHE_DIR: /data/hls
      GIN_MODE: release
    ports:
      # Local only by default: a reverse proxy on this machine reaches it, the
      # network doesn't. BIND_ADDRESS=0.0.0.0 in .env opens it to the network.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - db_data:/data
      # Mount your folders in docker-compose.override.yml, not here — see
      # docker-compose.override.example.yml.

volumes:
  db_data:
